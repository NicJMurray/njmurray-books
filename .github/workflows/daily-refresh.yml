name: Daily Goodreads refresh

on:
  schedule:
    - cron: "24 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: njmurray-books-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GOODREADS_LIST_URL: ${{ vars.GOODREADS_LIST_URL }}
      GOODREADS_WANT_TO_READ_LIST_URL: ${{ vars.GOODREADS_WANT_TO_READ_LIST_URL }}
      GOODREADS_RSS_URL: ${{ vars.GOODREADS_RSS_URL }}
      GOODREADS_USER_ID: ${{ vars.GOODREADS_USER_ID }}
      GOODREADS_SHELF: ${{ vars.GOODREADS_SHELF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "22c1482ec05957092be7a2df424c4543"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Goodreads data
        run: npm run refresh:goodreads

      - name: Commit data changes
        run: |
          if git diff --quiet -- src/data/books.json src/data/wantToRead.json; then
            echo "No Goodreads data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/books.json src/data/wantToRead.json
          git commit -m "Refresh Goodreads data"
          git push

      - name: Build
        run: npm run build

      - name: Check deployment token
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Snapshot refresh completed, but CLOUDFLARE_API_TOKEN must be set as a repository secret to deploy."
            exit 1
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
